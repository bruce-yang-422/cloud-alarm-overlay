<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的任務 · 月曆檢視設計稿</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--paper:#fff;--ink:#202733;--muted:#76808e;--line:#e5e8ed;--blue:#2863d5;--soft:#edf3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft JhengHei UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 12px;white-space:nowrap}button:hover{background:#f0f4fb;border-color:#c5d3e9}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:hover{background:#1e51b4;color:white}.muted{color:var(--muted)}.small{font-size:12px}.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:#fcfcfd;border-bottom:1px solid var(--line)}.brand{font-size:18px;font-weight:600;display:flex;gap:12px;align-items:center}.brand .icon{color:var(--blue);width:26px;height:26px}.demo{font-size:12px;color:#667184;background:#eef0f4;padding:4px 10px;border-radius:5px}.app{display:grid;grid-template-columns:174px 1fr;min-height:calc(100vh - 60px)}nav{padding:24px 12px;border-right:1px solid var(--line);background:#eff1f5;display:flex;flex-direction:column;gap:7px}.navlabel{font-size:11px;color:var(--muted);padding:0 13px;margin-bottom:12px}.navitem{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:7px;color:#657184}.navitem.active{background:#e0e8f7;color:#2055b9;font-weight:600}.navfoot{margin-top:auto;padding:26px 12px 0;font-size:11px;color:var(--muted)}main{min-width:0;padding:25px 26px 16px}.pagehead,.toolbar,.monthnav,.tools,.detailtop{display:flex;align-items:center;justify-content:space-between;gap:12px}.pagehead{margin-bottom:21px}h1{font-size:25px;font-weight:650;margin:0 0 3px}h2{font-size:17px;margin:0}.pagehead p{margin:0;color:var(--muted);font-size:12px}.tools{justify-content:flex-start}.seg{display:flex;background:#e9ecf1;padding:3px;border-radius:8px}.seg button{border:0;background:transparent;padding:5px 14px;font-size:13px}.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px #00000012;color:#244f98}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}.calendar{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}.toolbar{padding:16px;flex-wrap:wrap}.monthnav{justify-content:flex-start;gap:8px}.monthnav h2{margin-right:8px;font-size:19px}.arrow{padding:5px 9px;font-size:18px;line-height:24px}.toolbar input{width:145px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:#fafbfc;color:var(--ink)}select{border:1px solid var(--line);border-radius:6px;background:white;padding:6px 9px;color:var(--ink)}.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);background:#fafbfc;color:#808894;font-size:12px;text-align:right}.weekdays span{padding:8px 12px}.week{position:relative;height:122px;border-top:1px solid var(--line)}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:100%}.day{min-width:0;position:relative;border:0;border-radius:0;border-right:1px solid var(--line);padding:0;background:white;align-content:start;text-align:right}.day:last-child{border-right:0}.day:nth-child(n+6){background:#fafbfc}.day.outside{color:#acb2bc}.day.selected{background:#f0f5fe}.day .num{position:absolute;top:6px;right:8px;display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:25px;margin:0}.day.today .num{background:var(--blue);color:white;border-radius:50%}.bars{position:absolute;left:0;right:0;top:37px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:23px;gap:4px 0;pointer-events:none}.event{pointer-events:auto;overflow:hidden;text-overflow:ellipsis;text-align:left;border:0;border-left:3px solid currentColor;border-radius:4px;font-size:12px;font-weight:550;padding:2px 7px;margin:0 3px;line-height:19px}.event.green{background:#e7f2ed;color:#286749}.event.blue{background:#e7efff;color:#295bab}.event.amber{background:#faf0dc;color:#865e17}.event.continues-left{border-radius:0 4px 4px 0;border-left:0}.event.continues-right{border-radius:4px 0 0 4px}.event.chosen{box-shadow:inset 0 0 0 1.5px currentColor}.event:hover{filter:brightness(.96)}.overflow{position:absolute;bottom:4px;left:8px;font-size:11px;color:var(--blue);padding:0}.legend{padding:11px 16px;display:flex;flex-wrap:wrap;gap:16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}.detail{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px;min-width:0}.detailtop{font-size:12px;color:var(--muted);margin-bottom:18px}.detailtop button{padding:3px 8px;font-size:12px}.tag{display:inline-block;font-size:11px;background:#edf3ff;color:#3861a3;border-radius:4px;padding:2px 7px;margin-bottom:8px}.detail h2{font-size:20px;line-height:1.5;margin:0 0 18px;overflow-wrap:anywhere}.section{padding:16px 0;border-top:1px solid var(--line)}.sectiontitle{color:var(--muted);font-size:11px;margin-bottom:8px}.datepair{display:grid;grid-template-columns:30px 1fr;gap:8px;font-size:13px}.datepair .muted{font-size:11px;padding-top:2px}.duration{color:#367356;font-size:12px;margin-top:11px}.callout{background:#f7f8fa;border-radius:6px;padding:10px;font-size:12px;color:#76808e;margin-top:12px}.detail .primary{width:100%;margin-top:8px}.detailsub{font-size:12px;color:#75808d;margin-top:8px}.empty{padding:32px 18px;color:var(--muted);text-align:center;font-size:13px}.dayevent{width:100%;white-space:normal;text-align:left;margin:7px 0;padding:10px}.list{padding:0 16px 12px}.listrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:15px 8px;border-top:1px solid var(--line);width:100%;border-radius:0;border-left:0;border-right:0;border-bottom:0;text-align:left}.listrow small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.listrow .tag{margin:0;align-self:center}.note{margin-top:12px;display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#7b8593}.editor label{display:block;font-size:12px;color:#606d7e;margin:12px 0 5px}.editor input:not([type=checkbox]),.editor textarea{width:100%;padding:8px 9px;border:1px solid #dce1e8;border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-size:13px}.editor textarea{resize:vertical;min-height:64px}.editor .check{display:flex;gap:7px;align-items:center;color:var(--ink)}.error{color:#b43c45;font-size:12px;min-height:18px;margin-top:8px}.status{color:#367356;font-size:12px;margin-top:8px}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}@media(max-width:1150px){.app{grid-template-columns:145px 1fr}main{padding:18px 16px}.workspace{grid-template-columns:minmax(0,1fr) 250px;gap:12px}.toolbar{padding:12px}.toolbar .tools{width:100%}.toolbar input{flex:1}.event{font-size:11px;padding-left:4px}.week{height:122px}.navitem{padding:10px 8px}}@media(max-width:850px){nav{display:none}.app{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.detail{max-width:none}.week{height:122px}.pagehead{flex-wrap:wrap}.brand{font-size:15px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="cloud" viewBox="0 0 24 24"><path d="M5 18a4 4 0 0 1-1-8 7 7 0 0 1 13-3 5.5 5.5 0 0 1 1 11Z"/><path d="m9 13 2 2 5-5"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-8 9 8M5 9v12h5v-7h4v7h5V9"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6h5"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21 3 12C-2 4 7 0 12 7c5-7 14-3 9 5Z"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></symbol>
</defs></svg>
<header class="top"><div class="brand"><svg class="icon"><use href="#cloud"/></svg>Cloud Alarm Overlay</div><span class="demo">月曆檢視 · 互動設計稿</span></header>
<div class="app">
<nav aria-label="程式導覽示意"><div class="navlabel">工作空間</div><div class="navitem"><svg class="icon"><use href="#home"/></svg>首頁</div><div class="navitem active"><svg class="icon"><use href="#list"/></svg>我的任務</div><div class="navitem"><svg class="icon"><use href="#clock"/></svg>倒數／正數</div><div class="navitem"><svg class="icon"><use href="#heart"/></svg>健康工具</div><div class="navitem"><svg class="icon"><use href="#clock"/></svg>番茄鐘</div><div class="navitem"><svg class="icon"><use href="#list"/></svg>歷史紀錄</div><div class="navitem"><svg class="icon"><use href="#settings"/></svg>設定</div><div class="navfoot">設計預覽<br>範例資料，不會寫入正式任務</div></nav>
<main>
<div class="pagehead"><div><h1>我的任務</h1><p>在月曆安排活動期間，也保留每件事的提醒時間。</p></div><div class="tools"><div class="seg" aria-label="檢視模式"><button id="listMode" aria-pressed="false">清單</button><button id="monthMode" aria-pressed="true">月曆</button></div><button class="primary" id="add">＋ 新增活動</button></div></div>
<div class="workspace"><section class="calendar" aria-label="任務月曆">
<div class="toolbar"><div class="monthnav"><h2 id="monthTitle"></h2><button class="arrow" id="prev" aria-label="上個月">‹</button><button class="arrow" id="next" aria-label="下個月">›</button><button id="today">今天</button></div><div class="tools"><input id="search" type="search" placeholder="搜尋活動" aria-label="搜尋活動"><select id="source" aria-label="篩選來源"><option value="all">全部來源</option><option value="local">本機</option><option value="google">Google</option></select></div></div>
<div id="monthView"><div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="weeks"></div></div><div class="list" id="listView" hidden></div>
<div class="legend"><span><i class="dot" style="background:#518469"></i>日期區間／全天</span><span><i class="dot" style="background:#4c79bd"></i>指定時間活動</span><span><i class="dot" style="background:#bc9449"></i>單次提醒</span></div>
</section><aside class="detail" id="detail" aria-label="活動詳細資料" aria-live="polite"></aside></div>
<footer class="note"><span>跨日活動會接續到下一週；日期區間包含結束日。</span><span id="feedback">點選色帶查看活動，點選日期查看當日安排。</span></footer>
</main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Date(s.length===10?s+'T00:00:00':s),day=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()),addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,short=d=>`${d.getMonth()+1}/${d.getDate()}`,clock=d=>`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,weekday=d=>'日一二三四五六'[d.getDay()];
let month=new Date(2026,9,1),selected='rx',selectedDay=null,mode='month';
let events=[
 {id:'rx',title:'慢性處方箋領藥',start:'2026-10-01',end:'2026-10-10',allDay:true,kind:'range',source:'local',reminder:'2026-10-01T09:00',note:'在領藥期間內完成即可；記得攜帶健保卡與處方箋。'},
 {id:'pet',title:'寵物展',start:'2026-10-02T10:00',end:'2026-10-05T20:00',allDay:false,kind:'range',source:'local',reminder:'2026-10-02T09:00',note:'週五上午 10 點開始，週一晚上 8 點結束。'},
 {id:'once',title:'繳交報告',start:'2026-10-15T15:30',end:'2026-10-15T15:30',allDay:false,kind:'point',source:'local',reminder:'2026-10-15T15:30',note:'既有單次提醒仍可直接顯示在月曆。'}];
function lastDay(e){return e.allDay?date(e.end):day(new Date(Math.max(+date(e.start),+date(e.end)-1)))}
function matches(e){return e.title.toLowerCase().includes($('#search').value.trim().toLowerCase())&&($('#source').value==='all'||e.source===$('#source').value)}
function occurs(e,d){return day(date(e.start))<=d&&lastDay(e)>=d}
function fullDate(s,allDay){const d=date(s);return `${d.getFullYear()}/${short(d)}（${weekday(d)}）${allDay?'':clock(d)}`}
function period(e){return e.kind==='point'?fullDate(e.start,false):`${fullDate(e.start,e.allDay)} ～ ${fullDate(e.end,e.allDay)}`}
function paint(){
 $('#monthTitle').textContent=`${month.getFullYear()} 年 ${month.getMonth()+1} 月`;
 $('#monthView').hidden=mode!=='month';$('#listView').hidden=mode!=='list';$('#monthMode').setAttribute('aria-pressed',mode==='month');$('#listMode').setAttribute('aria-pressed',mode==='list');
 const first=new Date(month.getFullYear(),month.getMonth(),1),last=new Date(month.getFullYear(),month.getMonth()+1,0),start=addDays(first,-((first.getDay()+6)%7));
 const rows=Math.ceil(((first.getDay()+6)%7+last.getDate())/7),filtered=events.filter(matches).sort((a,b)=>+date(a.start)-+date(b.start));
 let html='';for(let w=0;w<rows;w++){
  const ws=addDays(start,w*7),we=addDays(ws,6),weekEvents=filtered.filter(e=>day(date(e.start))<=we&&lastDay(e)>=ws),lanes=[];
  const placements=weekEvents.map(e=>{const from=Math.max(0,Math.round((day(date(e.start))-ws)/86400000)),to=Math.min(6,Math.round((lastDay(e)-ws)/86400000));let lane=0;while(lanes[lane]>=from)lane++;lanes[lane]=to;return{e,from,to,lane}});
  html+='<div class="week"><div class="days">';for(let i=0;i<7;i++){
   const d=addDays(ws,i),excess=placements.filter(p=>p.lane>=3&&p.from<=i&&p.to>=i).length;
   html+=`<button class="day ${d.getMonth()!==month.getMonth()?'outside':''} ${iso(d)===iso(new Date())?'today':''} ${selectedDay===iso(d)?'selected':''}" data-day="${iso(d)}" aria-label="${fullDate(iso(d),true)}"><span class="num">${d.getDate()}</span>${excess?`<span class="overflow">＋${excess} 項</span>`:''}</button>`;
  }html+='</div><div class="bars">';for(const {e,from,to,lane} of placements.filter(p=>p.lane<3)){
   const left=day(date(e.start))<ws,right=lastDay(e)>we,color=e.kind==='point'?'amber':e.allDay?'green':'blue';
   let caption=e.title;if(left)caption='← '+caption;if(!e.allDay&&!left)caption=clock(date(e.start))+' '+caption;if(!e.allDay&&left&&!right)caption='← '+clock(date(e.end))+' '+e.title;if(right)caption+=' →';
   html+=`<button class="event ${color} ${selected===e.id?'chosen':''} ${left?'continues-left':''} ${right?'continues-right':''}" style="grid-column:${from+1}/span ${to-from+1};grid-row:${lane+1}" data-event="${esc(e.id)}" title="${esc(e.title+' · '+period(e))}" aria-label="${esc(e.title+' · '+period(e))}">${esc(caption)}</button>`;
  }html+='</div></div>';
 }$('#weeks').innerHTML=html;
 const visible=filtered.filter(e=>day(date(e.start))<=last&&lastDay(e)>=first);
 $('#listView').innerHTML=visible.length?visible.map(e=>`<button class="listrow" data-event="${e.id}"><span><strong>${esc(e.title)}</strong><small>${esc(period(e))}</small></span><span class="tag">${e.allDay?'全天區間':e.kind==='point'?'單次提醒':'跨日活動'}</span></button>`).join(''):'<div class="empty">本月沒有符合條件的活動。</div>';
}
function showEvent(id){selected=id;selectedDay=null;paint();const e=events.find(e=>e.id===id);if(!e)return;
 const days=Math.round((lastDay(e)-day(date(e.start)))/86400000)+1;
 $('#detail').innerHTML=`<div class="detailtop"><span>活動詳細資料</span><span>本機</span></div><span class="tag">${e.allDay?'全天 · 日期區間':e.kind==='point'?'單次提醒':'指定時間 · 跨日活動'}</span><h2>${esc(e.title)}</h2><section class="section"><div class="sectiontitle">${e.kind==='point'?'提醒時間':'活動期間'}</div><div class="datepair"><span class="muted">開始</span><span>${esc(fullDate(e.start,e.allDay))}</span>${e.kind!=='point'?`<span class="muted">結束</span><span>${esc(fullDate(e.end,e.allDay))}</span>`:''}</div>${e.kind!=='point'?`<div class="duration">涵蓋 ${days} 個日曆日${e.allDay?'，含最後一天':''}</div>`:''}</section><section class="section"><div class="sectiontitle">提醒設定</div><div>${e.reminder?esc(fullDate(e.reminder,false)):'不提醒'}</div><div class="detailsub">${e.reminder?'提醒一次':'僅在月曆顯示活動期間'}</div></section><section class="section"><div class="sectiontitle">備註</div><div class="small">${esc(e.note||'尚無備註')}</div></section><button class="primary" id="edit">編輯活動</button><div class="callout">活動期間與提醒時間分開設定。跨日色帶不代表每天都會通知。</div>`;
 $('#edit').onclick=()=>edit(e);
}
function showDay(key){selected=null;selectedDay=key;paint();const d=date(key),items=events.filter(e=>matches(e)&&occurs(e,d));$('#detail').innerHTML=`<div class="detailtop"><span>當日安排</span><span>${items.length} 項</span></div><h2>${fullDate(key,true)}</h2>${items.length?items.map(e=>`<button class="dayevent" data-event="${e.id}"><strong>${esc(e.title)}</strong><div class="small muted">${e.allDay?'全天區間':esc(period(e))}</div></button>`).join(''):'<div class="empty">這天沒有安排。</div>'}<button class="primary" id="addDay">在這天新增活動</button>`;$('#addDay').onclick=()=>edit(null,key)}
function edit(original,key){const e=original?{...original}:{id:'new-'+Date.now(),title:'',start:(key||iso(month))+'T10:00',end:(key||iso(month))+'T11:00',allDay:false,kind:'range',source:'local',reminder:'',note:''};
 $('#detail').innerHTML=`<div class="detailtop"><span>${original?'編輯活動':'新增活動'}</span><button id="cancel">取消</button></div><form id="editor" class="editor"><label for="title">活動名稱</label><input id="title" maxlength="50" required value="${esc(e.title)}" placeholder="例如：寵物展"><label class="check"><input id="allDay" type="checkbox" ${e.allDay?'checked':''}> 全天／日期區間</label><label for="start">開始</label><input id="start" type="${e.allDay?'date':'datetime-local'}" required value="${e.start}"><label for="end">結束${e.allDay?'（包含當日）':''}</label><input id="end" type="${e.allDay?'date':'datetime-local'}" required value="${e.end}"><div class="section" style="margin-top:18px"><label class="check"><input id="remind" type="checkbox" ${e.reminder?'checked':''}> 啟用提醒</label><input id="reminder" aria-label="提醒時間" type="datetime-local" ${e.reminder?'':'disabled'} value="${e.reminder}"><div class="detailsub">指定一次提醒時間，與活動期間分開保存。</div></div><label for="notes">備註</label><textarea id="notes">${esc(e.note)}</textarea><div class="error" id="error" role="alert"></div><button class="primary" type="submit">儲存預覽</button><div class="detailsub">僅儲存在這次預覽，重新整理即還原。</div></form>`;
 $('#cancel').onclick=()=>original?showEvent(original.id):showDay(key||iso(month));
 $('#allDay').onchange=()=>{const all=$('#allDay').checked;for(const id of ['start','end']){const v=$('#'+id).value;$('#'+id).type=all?'date':'datetime-local';$('#'+id).value=all?v.slice(0,10):v.slice(0,10)+(id==='start'?'T10:00':'T20:00')}document.querySelector('label[for=end]').textContent=all?'結束（包含當日）':'結束'};
 $('#remind').onchange=()=>{$('#reminder').disabled=!$('#remind').checked;if($('#remind').checked&&!$('#reminder').value)$('#reminder').value=$('#start').value.slice(0,10)+'T09:00'};
 $('#editor').onsubmit=ev=>{ev.preventDefault();const item={...e,title:$('#title').value.trim(),start:$('#start').value,end:$('#end').value,allDay:$('#allDay').checked,reminder:$('#remind').checked?$('#reminder').value:'',note:$('#notes').value,kind:e.kind};if(item.kind==='point'){item.end=item.start;item.allDay=false;}if(!item.title||date(item.end)<date(item.start)||(item.kind!=='point'&&!item.allDay&&date(item.end)<=date(item.start))){$('#error').textContent='請填寫名稱，並讓結束晚於開始；全天區間可同一天。';return}if($('#remind').checked&&!item.reminder){$('#error').textContent='請設定提醒時間。';return}events=events.filter(x=>x.id!==e.id).concat(item);month=new Date(date(item.start).getFullYear(),date(item.start).getMonth(),1);showEvent(item.id);$('#feedback').textContent='已儲存預覽；正式任務資料未變更。'};
 $('#title').focus();
}
